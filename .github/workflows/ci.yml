name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Tests on every push and PR; on a passing push to main, deploys to Fly.
# One-time setup (app, database, secrets) is fly-bootstrap.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: finance_hub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hub -d finance_hub_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      HUB_TEST_DATABASE_URL: postgresql+psycopg://hub:hub@localhost:5432/finance_hub_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm 10 crashes resolving vitest 4's optional peers; npm 11 reads the lockfile cleanly.
      - run: npm install -g npm@11 && npm ci --no-audit --no-fund
      - run: npx ng test --watch=false
      - run: npx ng build --configuration production

  deploy:
    name: Deploy to Fly.io
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: ${{ vars.FLY_APP || 'finance-hub' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Skip until bootstrapped
        id: ready
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then echo "::warning::FLY_API_TOKEN not set; skipping deploy"; exit 0; fi
          if ! flyctl status --app "$APP" >/dev/null 2>&1; then
            echo "::warning::app $APP does not exist yet; run the 'Fly bootstrap' workflow once"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - if: steps.ready.outputs.go == 'true'
        run: flyctl deploy --remote-only --app "$APP"
