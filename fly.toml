# Fly.io config. One app, one machine, Fly Postgres attached (DATABASE_URL secret).
# First-time setup is in README.md under "Deploy".
app = "finance-hub"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Migrations run once per deploy, before the new machine takes traffic.
  release_command = "alembic upgrade head"

[env]
  PORT = "8080"
  HUB_STATIC_DIR = "/app/static"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
