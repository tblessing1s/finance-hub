# Database only. The API and the Angular dev server run on the host via `make dev`.
services:
  db:
    image: postgres:16
    container_name: finance-hub-db
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: finance_hub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d finance_hub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
